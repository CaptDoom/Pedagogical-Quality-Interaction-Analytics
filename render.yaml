services:
  - type: web
    name: classlens
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: classlens-model-cache
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: WHISPER_MODEL
        value: base
      - key: DEFAULT_LLM_BACKEND
        value: none
      - key: SPEAKER_DIARIZATION
        value: "false"
      - key: APP_PASSWORD
        generateValue: true
